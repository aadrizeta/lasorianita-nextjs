# SOLO PARA DESARROLLO LOCAL.
#
# La produccion se despliega en Coolify con el build pack "Dockerfile", que
# ignora este archivo por completo: el dominio, el proxy, el puerto, el volumen
# persistente y las variables se configuran en su interfaz. Ver DEPLOY.md.
#
# Uso local:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    build:
      context: .
    container_name: lasorianita
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_NOTIFY=${MAIL_NOTIFY}
      - DB_PATH=/app/data/lasorianita.db
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
