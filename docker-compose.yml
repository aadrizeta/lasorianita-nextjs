services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAPS_API_KEY: ${NEXT_PUBLIC_MAPS_API_KEY}
        NEXT_PUBLIC_MAP_ID: ${NEXT_PUBLIC_MAP_ID}
    container_name: lasorianita
    restart: unless-stopped
    environment:
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - INSTAGRAM_BUSINESS_ID=${INSTAGRAM_BUSINESS_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_NOTIFY=${MAIL_NOTIFY}
      - DB_PATH=/app/data/lasorianita.db
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - proxy

volumes:
  app-data:

networks:
  proxy:
    external: true
    name: matching-matcha-web-nextjs_default
